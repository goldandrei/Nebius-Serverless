    instance_type: 1gpu-8vcpu-32gb
    rate_hr: 1.82

  - id: Qwen/Qwen2.5-32B-Instruct
    tokenfactory_ok: false
    basis: self-hosted
    preset: gpu-h100-sxm
    instance_type: 1gpu-16vcpu-200gb
    rate_hr: 3.85
    load_timeout_s: 600  # 10 min — 64 GB weights on H100

  # 72B fp8 = ~72 GB — fits single H200 SXM (141 GB HBM3e); fp8 quantized on-the-fly by vLLM
  - id: Qwen/Qwen2.5-72B-Instruct
    tokenfactory_ok: false
    basis: self-hosted
    preset: gpu-h200-sxm
    instance_type: 1gpu-16vcpu-200gb
    rate_hr: 4.50
    max_model_len: 8192
    extra_vllm_args: "--quantization fp8"
    load_timeout_s: 900       # 15 min — 72 GB fp8 weights on H200

