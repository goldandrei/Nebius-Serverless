# Full model catalog — every model the harness knows how to run.
# Add any HF model ID supported by vLLM here.
#
# preset / instance_type: choose based on VRAM needed (fp16: ~2 GB per 1B params)
#   gpu-l40s-a  / 1gpu-8vcpu-32gb   — L40S 48 GB, good up to ~20B fp16
#   gpu-h100-sxm / 1gpu-20vcpu-200gb — H100 80 GB, good up to ~70B fp16
#
# rate_hr: VERIFY on https://nebius.com/pricing before reporting costs
#   L40S ~$1.55/hr  |  H100 SXM ~$3.80/hr  |  H200 SXM ~$5.50/hr
#
# gated: true — requires HF_TOKEN + license acceptance on hf.co
#
# mock profile fields:
#   Structured output (programmatic scorer):
#     p_bad_json, p_wrong_intent, p_slot_err
#   Factual Q&A (reference_match scorer):
#     p_ref_err       — probability of a wrong factual answer
#   Instruction following (llm_judge scorer):
#     judge_score_mean, judge_score_sd — simulated judge verdict distribution
#   Latency:
#     lat_mean, lat_sd — response time in seconds

