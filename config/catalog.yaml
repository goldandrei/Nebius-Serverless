# Full model catalog — every model the harness knows how to run.
# Add any HF model ID supported by vLLM here.
#
# preset / instance_type: VERIFIED valid strings from `nebius compute platform list`
# (run that command to re-confirm; these are the exact preset names the API accepts)
#
#   Single-GPU:
#   gpu-l40s-a   / 1gpu-8vcpu-32gb    — 1×L40S 48 GB VRAM (Intel), good up to ~20B fp16
#   gpu-h100-sxm / 1gpu-16vcpu-200gb  — 1×H100 80 GB VRAM, good up to ~38B fp16  ← 16 vCPU, NOT 20
#   gpu-h200-sxm / 1gpu-16vcpu-200gb  — 1×H200 141 GB VRAM, good for ~47B MoE (e.g. Mixtral)
#
#   Multi-GPU (L40S-D AMD, PCIe — no NVLink; requires --tensor-parallel-size N in vLLM args):
#   gpu-l40s-d   / 4gpu-128vcpu-768gb  — 4×L40S 192 GB VRAM total, good for 70B/72B fp16; TP=4
#   gpu-l40s-d   / 2gpu-64vcpu-384gb   — 2×L40S  96 GB VRAM total; too tight for 47B+ MoE
#
#   (H100/H200 multi-GPU only comes in 8-GPU NVLink form at $30+/hr — avoid for evals)
#
# tensor_parallel_size: required for multi-GPU presets; injected into vLLM --args by orchestrator
#
# rate_hr: verified 2026-07-04 from nebius.com/prices (on-demand, per GPU-hour)
#   L40S-A Intel  $1.82/hr  |  L40S-D AMD $1.55/hr  |  H100 SXM $3.85/hr  |  H200 SXM $4.50/hr
#   4×L40S-D = 4 × $1.55 = $6.20/hr (pricing page shows "from" $1.55; 4-GPU preset may differ — verify)
#
# max_model_len: vLLM context window cap. Default 8192 (our eval prompts are short).
#   Without this, vLLM uses the model's config max (e.g. 131072 for 32B) which needs
#   gigabytes of KV-cache VRAM and will OOM on a single GPU. Override per-model if needed.
#
# gated: true — requires HF_TOKEN + license acceptance on hf.co
#
models:

  # ── Qwen 2.5 ─────────────────────────────────────────────────────────────────
  # tokenfactory_ok: verified against GET /v1/models on api.tokenfactory.nebius.com
  # Only large production models are hosted there; sub-7B models are not.
  - id: Qwen/Qwen2.5-0.5B-Instruct
    tokenfactory_ok: false
    basis: self-hosted
    preset: gpu-l40s-a
    instance_type: 1gpu-8vcpu-32gb
    rate_hr: 1.82

  - id: Qwen/Qwen2.5-1.5B-Instruct
    tokenfactory_ok: false
    basis: self-hosted
    preset: gpu-l40s-a
    instance_type: 1gpu-8vcpu-32gb
    rate_hr: 1.82

  - id: Qwen/Qwen2.5-3B-Instruct
    tokenfactory_ok: false
