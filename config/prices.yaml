# Token Factory per-model pricing snapshot.
#
# The pricing page (https://tokenfactory.nebius.com/pricing) is a pure JS SPA.
# There is no public pricing REST API — all rates are behind an authenticated
# internal billing service not reachable by API key. Therefore prices are kept
# here as a manually-updated snapshot.
#
# IDs are the EXACT strings returned by GET /v1/models on api.studio.nebius.com
# (verified 2026-07-04). Drop any id not in that list; mark any unknown price
# with null and a TODO comment — never guess.
#
# Flags (informational — also set on catalog.yaml entries):
#   vision: true    — accepts image inputs (text-task comparisons may exclude)
#   reasoning: true — extended thinking/reasoning (higher output cost per token)
#   embedding: true — embedding model (scorer use only; not for text inference)
prices_as_of: "2026-08-03"
source: "Token Factory console — Public endpoints (per 1M tokens)"

